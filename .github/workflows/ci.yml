name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & lint (if Node project)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint || true
          else
            echo "No package.json found — skipping Node lint steps"
          fi

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test (if Node project)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm test -- --coverage
            if [ -d coverage ]; then
              echo "Coverage directory present"
            fi
          else
            echo "No package.json found — skipping Node test steps"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build (if Node project)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No package.json found — skipping Node build steps"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
