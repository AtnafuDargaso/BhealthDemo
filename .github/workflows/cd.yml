name: CD
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: simple-webapp
            image: simple-webapp
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push ${{ matrix.app.name }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app.name }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app.image }}:latest
      - name: Set outputs
        run: echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app.image }}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-staging:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: 
      name: staging
      url: https://simple-webapp-staging.example.com
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "📦 Image: ${{ needs.build-and-push.outputs.image }}"
          echo ""
          echo "Mock deployment command:"
          echo "gcloud run deploy simple-webapp \\"
          echo "  --image ${{ needs.build-and-push.outputs.image }} \\"
          echo "  --region us-central1 \\"
          echo "  --platform managed \\"
          echo "  --environment staging"
          echo ""
          echo "✅ Staging deployment approved and simulated successfully!"
          echo "Service URL: https://simple-webapp-staging.example.com"

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://simple-webapp.example.com
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "📦 Image: ${{ needs.build-and-push.outputs.image }}"
          echo ""
          echo "Mock deployment command:"
          echo "gcloud run deploy simple-webapp \\"
          echo "  --image ${{ needs.build-and-push.outputs.image }} \\"
          echo "  --region us-central1 \\"
          echo "  --platform managed \\"
          echo "  --environment production"
          echo ""
          echo "✅ Production deployment approved and simulated successfully!"
          echo "Service URL: https://simple-webapp.example.com"

